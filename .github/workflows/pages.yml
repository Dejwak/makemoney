name: Nasazení na GitHub Pages

# Web běží na https://cinkne.cz (Settings → Pages, Source: GitHub Actions).
# Nasazuje se při každém pushi do hlavní větve; jde spustit i ručně.
on:
  workflow_dispatch:
  push:
    branches: [main, claude/gallant-galileo-r2oetd]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Připravit složku webu
        run: |
          mkdir _site
          cp -r index.html config.js robots.txt sitemap.xml assets .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
