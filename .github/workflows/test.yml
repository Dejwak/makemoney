name: Testy

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Průchod aplikací v prohlížeči
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          npm run test:e2e
